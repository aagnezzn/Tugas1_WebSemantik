<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Film Pop Culture</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 30px; 
            background-color: #120919; 
            color: #ffffff; 
        }
        
        h2 { 
            text-align: center; 
            color: #ffffff; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 20px rgba(184, 142, 204, 0.6);
        }
        
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 20px; 
            border: 1px solid #4a215e; 
            border-radius: 10px;
            overflow: visible;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(136, 105, 150, 0.35);
        } 
        
        th { 
            background-color: #481c52; 
            color: #ffffff; 
            text-transform: uppercase;
            font-weight: 600;
            box-shadow: inset 0 -3px 8px rgba(0, 0, 0, 0.5);
        }
        
        th, td { 
            border-bottom: 1px solid #2e143f; 
            border-right: 1px solid #2e143f;
            padding: 12px; 
            text-align: center; 
            vertical-align: middle;
        }
        
        th:last-child, td:last-child {
            border-right: none;
        }

        td.text-left {
            text-align: left;
        }

        tr {
            transition: all 0.2s ease;
        }

        tr:nth-child(odd) { 
            background-color: #180c24; 
        }
        
        tr:nth-child(even) { 
            background-color: #1f102e; 
        }
        
       tbody tr:hover {
            color: #ffffff;
        }

        tbody tr:hover {
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow:
                0 -5px 15px rgba(241, 143, 231, 0.8),
                0 8px 20px rgba(241, 143, 231, 0.8);
            position: relative;
            z-index: 10;
        }

        .poster-img {
            width: 70px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.8), 0 0 12px rgba(216, 180, 254, 0.3);
        }
    </style>
</head>
<body>

    <h2>Daftar Film &amp; Serial Popular</h2>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Poster</th>
                <th>Judul</th>
                <th>Sutradara</th>
                <th>Genre</th>
                <th>Tahun</th>
            </tr>
        </thead>
        <tbody id="data-tabel"></tbody>
    </table>

    <script>
        // Mengambil data XML
fetch('Latihan1.xml')
    .then(response => response.text())
    .then(xmlText => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const filmList = xmlDoc.getElementsByTagName("film");
        const tbody = document.getElementById("data-tabel");

        let rows = ""; 
        for (let i = 0; i < filmList.length; i++) {
            const item = filmList[i];
            const poster = item.getElementsByTagName("poster")[0].textContent;
            const judul = item.getElementsByTagName("judul")[0].textContent;
            const sutradara = item.getElementsByTagName("sutradara")[0].textContent;
            const genre = item.getElementsByTagName("genre")[0].textContent;
            const tahun = item.getElementsByTagName("tahun")[0].textContent;

            rows += `
                <tr>
                    <td>${i + 1}</td>
                    <td><img src="${poster}" alt="${judul}" class="poster-img"></td>
                    <td class="text-left">${judul}</td>
                    <td class="text-left">${sutradara}</td>
                    <td>${genre}</td>
                    <td>${tahun}</td>
                </tr>
            `;
        }
        tbody.innerHTML = rows; 
    })
    .catch(error => console.error("Gagal mengambil data XML:", error));
    </script>

</body>
</html>
